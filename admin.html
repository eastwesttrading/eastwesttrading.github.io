<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | EAST WEST PLC</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div id="loginSection" class="login-card">
        <h2>Admin Authentication</h2>
        <form id="loginForm" style="margin-top: 15px;">
            <div class="form-control">
                <label>Email Address</label>
                <input type="email" id="adminEmail" required>
            </div>
            <div class="form-control">
                <label>Password</label>
                <input type="password" id="adminPassword" required>
            </div>
            <button type="submit" style="width:100%; padding: 12px; background: #0F382C; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Login</button>
        </form>
    </div>

    <div id="dashboardSection" class="admin-container" style="display: none;">
        <div class="admin-header">
            <h2>EAST WEST PLC - Management Portal</h2>
            <button id="logoutBtn" style="padding: 8px 16px; background: #64748b; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Logout</button>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Add New Product</h3>
                <form id="addProductForm" style="margin-top: 15px;">
                    <div class="form-control">
                        <label>Product Name</label>
                        <input type="text" id="pName" required>
                    </div>
                    <div class="form-control">
                        <label>Category</label>
                        <select id="pCategory">
                            <option value="export">Export</option>
                            <option value="import">Import</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label>Image URL</label>
                        <input type="url" id="pImage" required>
                    </div>
                    <div class="form-control">
                        <label>Description</label>
                        <textarea id="pDesc" rows="3" required></textarea>
                    </div>
                    <button type="submit" style="width:100%; padding: 10px; background: #D4AF37; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Save Product</button>
                </form>
            </div>

            <div class="card">
                <h3>Live Commodity Database</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
