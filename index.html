<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo-container">
      <img id="site-logo" src="" alt="Logo" class="hidden">
      <span id="company-name">...</span>
    </div>
    <nav>
      <a href="#hero" id="lbl-navHome">Home</a>
      <a href="#products" id="lbl-navProducts">Products</a>
      <a href="#gallery" id="lbl-navGallery">Gallery</a>
      <a href="#contact" id="lbl-navContact">Contact</a>
      <a href="admin.html" id="lbl-navAdmin">Admin</a>
    </nav>
    <div class="lang-switch">
      <button id="btn-lang-en" class="active">EN</button>
      <button id="btn-lang-am">አማ</button>
    </div>
  </header>

  <section id="hero" class="hero-section">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 id="hero-title">...</h1>
      <p id="hero-subtitle">...</p>
    </div>
  </section>

  <section id="about" class="container">
    <h2>About Us</h2>
    <p id="about-text">...</p>
    <div class="mv-grid">
      <div class="card">
        <h3>Mission</h3>
        <p id="mission-text">...</p>
      </div>
      <div class="card">
        <h3>Vision</h3>
        <p id="vision-text">...</p>
      </div>
    </div>
  </section>

  <section id="products" class="container">
    <h2>Our Products</h2>
    <div id="product-grid" class="grid"></div>
  </section>

  <section id="gallery" class="container">
    <h2>Gallery</h2>
    <div id="gallery-grid" class="gallery-grid"></div>
  </section>

  <section id="contact" class="container">
    <h2 id="lbl-contactTitle">Get in Touch</h2>
    <div class="contact-wrapper">
      <div class="contact-info">
        <p><strong>Phone:</strong> <span id="contact-phone"></span></p>
        <p><strong>Email:</strong> <span id="contact-email"></span></p>
        <p><strong>Address:</strong> <span id="contact-address"></span></p>
        <div class="social-links">
          <a id="link-whatsapp" href="#" target="_blank">WhatsApp</a>
        </div>
      </div>
      <form id="public-contact-form" class="form">
        <input type="text" id="msg-name" placeholder="Your Name" required>
        <input type="email" id="msg-email" placeholder="Your Email" required>
        <input type="tel" id="msg-phone" placeholder="Phone Number">
        <textarea id="msg-text" placeholder="Your Message" rows="4" required></textarea>
        <button type="submit" id="lbl-sendBtn">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; <span id="footer-year"></span> <span id="footer-company"></span>. All rights reserved.</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
